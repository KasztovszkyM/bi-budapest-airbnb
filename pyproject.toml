[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airbnb-bi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy==2.0.41", "psycopg[binary]==3.2.9", "python-dotenv==1.1.0"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
airbnb-bi = "airbnb_bi.cli:main"

[tool.setuptools.package-data]
airbnb_bi = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

